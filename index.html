<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
    <title>天気ダッシュボード</title>
    <link rel="stylesheet" href="styles/kindle.css">
    <meta http-equiv="refresh" content="1800">
</head>
<body>
    <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
    <button class="theme-toggle" id="themeToggle" aria-label="ダークモード切り替え">🌙</button>
    <div class="container">
        <main id="main-content">
            
            <section class="weather-section">
                <div class="error-message">天気データの取得に失敗しました</div>
            </section>
            

            <section class="news">
                <div class="news-container">
                    <div class="news-column">
                        <h3 class="news-column-title">主要ニュース</h3>
                        
                        <div class="error-message">ニュースデータの取得に失敗しました</div>
                        
                    </div>
                    <div class="news-column">
                        <h3 class="news-column-title">経済ニュース</h3>
                        
                        <div class="error-message">経済ニュースデータの取得に失敗しました</div>
                        
                    </div>
                </div>
            </section>

            <section class="hatena-section">
                <h2 class="section-title">はてなブックマーク 人気エントリー</h2>
                <div class="hatena-container">
                    <div class="hatena-column">
                        <h3 class="hatena-column-title"><a href="https://b.hatena.ne.jp/hotentry/all" target="_blank" rel="noopener noreferrer">総合</a></h3>
                        
                        <div class="error-message">はてなブックマークデータの取得に失敗しました</div>
                        
                    </div>
                    <div class="hatena-column">
                        <h3 class="hatena-column-title"><a href="https://b.hatena.ne.jp/hotentry/knowledge" target="_blank" rel="noopener noreferrer">学び</a></h3>
                        
                        <div class="error-message">はてなブックマーク(学び)データの取得に失敗しました</div>
                        
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p class="update-time">最終更新: 2026/08/20 06:28</p>
            <p class="footer-credit">Powered by 天気予報 API (weather.tsukumijima.net) / NHK ニュース RSS / はてなブックマーク</p>
        </footer>
    </div>

    <script>
        
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        
        if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
